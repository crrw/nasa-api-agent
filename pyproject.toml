[project]
name = "nasa-agent"
version = "0.1.0"
description = "Agent for NASA APIs"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.118.0,<0.119.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "yapf>=0.43.0"
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
pythonVersion = "3.10"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
